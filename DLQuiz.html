<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Center</title>
  <style>
    :root {
      --primary:  #1a3c6e;
      --accent:   #e8791d;
      --success:  #16a34a;
      --danger:   #dc2626;
      --warn-bg:  #fffbeb;
      --warn-bd:  #f59e0b;
      --warn-tx:  #78350f;
      --bg:       #f0f4f8;
      --surface:  #ffffff;
      --text:     #1a1a2e;
      --muted:    #6b7280;
      --border:   #e2e8f0;
      --radius:   12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── screens ── */
    .screen { display: none; max-width: 780px; margin: 0 auto; padding: 20px 16px 48px; }
    .screen.active { display: block; }

    /* ── home ── */
    .home-header { text-align: center; padding: 40px 0 28px; }
    .home-header h1 { font-size: 2rem; color: var(--primary); }
    .home-header p  { color: var(--muted); margin-top: 6px; }
    .quiz-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
                 padding: 20px 22px; margin-bottom: 14px;
                 display: flex; align-items: center; gap: 18px;
                 cursor: pointer; transition: box-shadow .15s, transform .15s; }
    .quiz-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.1); transform: translateY(-2px); }
    .quiz-icon { width: 52px; height: 52px; border-radius: 10px; background: var(--primary);
                 display: flex; align-items: center; justify-content: center;
                 font-size: 1.5rem; flex-shrink: 0; }
    .quiz-info { flex: 1; min-width: 0; }
    .quiz-info h3 { font-size: 1.02rem; color: var(--primary); }
    .quiz-info p  { font-size: 0.83rem; color: var(--muted); margin-top: 2px; }
    .quiz-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .badge { font-size: 0.74rem; color: var(--muted); background: var(--bg);
             border: 1px solid var(--border); padding: 2px 9px; border-radius: 99px; }
    .btn-go { background: var(--accent); color: #fff; border: none;
              padding: 9px 18px; border-radius: 8px; font-size: 0.88rem;
              font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .btn-go:hover { background: #cf6b18; }

    /* ── quiz screen ── */
    .quiz-topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .btn-back { background: none; border: none; color: var(--muted); cursor: pointer;
                font-size: 1.1rem; padding: 4px 8px; border-radius: 6px; }
    .btn-back:hover { background: var(--border); color: var(--text); }
    .quiz-title-sm { font-size: 0.84rem; color: var(--muted); flex: 1;
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .prog-bar { flex: 1; height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .prog-fill { height: 100%; background: var(--primary); border-radius: 99px; transition: width .3s; }
    .prog-label { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }

    .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
              padding: 26px 26px 22px; margin-bottom: 14px; }
    .q-eyebrow { font-size: 0.74rem; font-weight: 700; color: var(--accent);
                 letter-spacing: .07em; text-transform: uppercase; margin-bottom: 10px; }
    .q-text { font-size: 1.05rem; font-weight: 500; line-height: 1.6; }
    .q-img  { text-align: center; margin: 4px 0 14px; }
    .q-img svg { filter: drop-shadow(0 2px 6px rgba(0,0,0,.2)); }

    .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .opt { display: flex; align-items: flex-start; gap: 12px;
           background: var(--surface); border: 2px solid var(--border); border-radius: 10px;
           padding: 13px 16px; cursor: pointer; font-size: 0.94rem; line-height: 1.45;
           transition: border-color .12s, background .12s; text-align: left; width: 100%; }
    .opt:hover:not(:disabled) { border-color: #2a5298; background: #eef2ff; }
    .opt-lbl { font-weight: 700; color: var(--primary); min-width: 20px; flex-shrink: 0; }
    .opt.selected  { border-color: var(--primary); background: #eef2ff; }
    .opt.correct   { border-color: var(--success); background: #f0fdf4; }
    .opt.wrong     { border-color: var(--danger);  background: #fff5f5; }
    .opt.show-correct { border-color: var(--success); background: #f0fdf4; }
    .opt:disabled  { cursor: default; }
    /* result icons inside options */
    .opt-result { margin-left: auto; font-size: 1rem; flex-shrink: 0; }

    /* explanation toggle */
    .expl-toggle-row { margin-bottom: 10px; }
    .btn-expl { background: none; border: 1px solid var(--warn-bd); color: var(--warn-tx);
                border-radius: 7px; padding: 6px 14px; font-size: 0.83rem; font-weight: 600;
                cursor: pointer; transition: background .12s; }
    .btn-expl:hover { background: var(--warn-bg); }

    .expl-box { background: var(--warn-bg); border: 1px solid var(--warn-bd);
                border-radius: 8px; padding: 12px 16px; font-size: 0.86rem;
                line-height: 1.55; color: var(--warn-tx); margin-bottom: 14px; }
    .expl-box b { display: block; margin-bottom: 3px; }

    .quiz-nav { display: flex; justify-content: space-between; align-items: center; }
    .btn-nav { padding: 10px 22px; border-radius: 8px; font-size: 0.93rem;
               font-weight: 600; cursor: pointer; border: none; transition: background .12s; }
    .btn-nav:disabled { opacity: .38; cursor: default; }
    .btn-prev  { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .btn-prev:hover:not(:disabled)  { background: #dde4ed; }
    .btn-next  { background: var(--primary); color: #fff; }
    .btn-next:hover:not(:disabled)  { background: #2a5298; }

    /* ── results ── */
    .results-hero { background: var(--surface); border: 1px solid var(--border);
                    border-radius: var(--radius); padding: 32px 24px 24px;
                    text-align: center; margin-bottom: 18px; }
    .score-ring { width: 116px; height: 116px; border-radius: 50%;
                  display: flex; flex-direction: column; align-items: center;
                  justify-content: center; margin: 0 auto 16px; font-weight: 700; }
    .score-ring.pass { background: #dcfce7; border: 4px solid var(--success); }
    .score-ring.fail { background: #fee2e2; border: 4px solid var(--danger); }
    .score-pct  { font-size: 2rem; line-height: 1; }
    .score-tag  { font-size: 0.68rem; letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }
    .score-stats { display: flex; justify-content: center; gap: 36px; margin: 14px 0 0; }
    .stat-val  { font-size: 1.4rem; font-weight: 700; }
    .stat-val.g { color: var(--success); }
    .stat-val.r { color: var(--danger);  }
    .stat-name { font-size: 0.73rem; color: var(--muted); }
    .results-title { font-size: 1.1rem; font-weight: 600; margin-top: 4px; }

    .results-actions { display: flex; gap: 10px; justify-content: center;
                       flex-wrap: wrap; margin-top: 18px; }
    .btn-action { padding: 10px 20px; border-radius: 8px; font-size: 0.9rem;
                  font-weight: 600; cursor: pointer; border: none; }
    .btn-home-a  { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .btn-home-a:hover  { background: #dde4ed; }
    .btn-retake-a  { background: var(--primary); color: #fff; }
    .btn-retake-a:hover  { background: #2a5298; }
    .btn-wrong-a   { background: var(--accent); color: #fff; }
    .btn-wrong-a:hover   { background: #cf6b18; }

    .review-panel { background: var(--surface); border: 1px solid var(--border);
                    border-radius: var(--radius); overflow: hidden; }
    .review-hdr { padding: 13px 20px; font-weight: 600; font-size: 0.88rem;
                  background: var(--bg); border-bottom: 1px solid var(--border); }
    .review-item { display: flex; gap: 14px; padding: 14px 20px;
                   border-bottom: 1px solid var(--border); align-items: flex-start; }
    .review-item:last-child { border-bottom: none; }
    .rev-icon { font-size: 1rem; margin-top: 1px; flex-shrink: 0; }
    .rev-body { flex: 1; min-width: 0; }
    .rev-q    { font-size: 0.88rem; font-weight: 500; margin-bottom: 4px; }
    .rev-ans  { font-size: 0.81rem; }
    .ans-ok   { color: var(--success); font-weight: 600; }
    .ans-bad  { color: var(--danger);  text-decoration: line-through; }

    @media (max-width: 500px) {
      .quiz-card { flex-direction: column; align-items: flex-start; }
      .q-card    { padding: 18px 14px 16px; }
      .results-actions { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

<!-- ══════════ HOME ══════════ -->
<div class="screen active" id="homeScreen">
  <div class="home-header">
    <h1>📚 Quiz Center</h1>
    <p>Select a quiz topic to begin</p>
  </div>
  <div id="quizList"></div>
</div>

<!-- ══════════ QUIZ ══════════ -->
<div class="screen" id="quizScreen">
  <div class="quiz-topbar">
    <button class="btn-back" onclick="goHome()">←</button>
    <span class="quiz-title-sm" id="quizTitleSm"></span>
  </div>
  <div class="progress-row">
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
    <span class="prog-label" id="progLabel"></span>
  </div>
  <div class="q-card">
    <div class="q-eyebrow" id="qEyebrow"></div>
    <div class="q-img"     id="qImg"    style="display:none;"></div>
    <div class="q-text"    id="qText"></div>
  </div>
  <div class="options" id="optContainer"></div>
  <div class="expl-toggle-row" id="explToggleRow" style="display:none;">
    <button class="btn-expl" id="btnExpl" onclick="toggleExpl()">💡 Show Explanation</button>
  </div>
  <div class="expl-box" id="explBox" style="display:none;"></div>
  <div class="quiz-nav">
    <button class="btn-nav btn-prev" id="btnPrev" onclick="prevQ()">← Prev</button>
    <button class="btn-nav btn-next" id="btnNext" onclick="nextQ()">Next →</button>
  </div>
</div>

<!-- ══════════ RESULTS ══════════ -->
<div class="screen" id="resultsScreen">
  <div class="results-hero">
    <div class="score-ring" id="scoreRing">
      <span class="score-pct" id="scorePct"></span>
      <span class="score-tag" id="scoreTag"></span>
    </div>
    <div class="results-title" id="resultsTitle"></div>
    <div class="score-stats">
      <div><div class="stat-val g" id="statOk"></div><div class="stat-name">Correct</div></div>
      <div><div class="stat-val r" id="statBad"></div><div class="stat-name">Incorrect</div></div>
      <div><div class="stat-val"   id="statTot"></div><div class="stat-name">Total</div></div>
    </div>
    <div class="results-actions">
      <button class="btn-action btn-home-a"  onclick="goHome()">🏠 All Quizzes</button>
      <button class="btn-action btn-retake-a" onclick="retakeAll()">🔄 Retake Quiz</button>
      <button class="btn-action btn-wrong-a"  id="btnRetakeWrong" onclick="retakeWrong()">⚡ Retake Incorrect</button>
    </div>
  </div>
  <div class="review-panel">
    <div class="review-hdr">Question Review</div>
    <div id="reviewList"></div>
  </div>
</div>

<!-- ══════════ QUIZ DATA ══════════ -->

// ════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════
let S = {
  quizId:   null,
  qs:       [],       // active question array (may be subset for retake)
  answers:  [],       // selected option index per question (null = unanswered)
  revealed: [],       // true immediately after picking an option
  explOpen: [],       // whether explanation panel is open for each question
  idx:      0,
  wrongIdx: [],       // original indices of wrong questions (for retake)
  mode:     'full'    // 'full' | 'retake'
};

// ════════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function goHome() {
  showScreen('homeScreen');
  renderHome();
}

// ════════════════════════════════════════════════
//  HOME
// ════════════════════════════════════════════════
function renderHome() {
  document.getElementById('quizList').innerHTML = QUIZZES.map(qz => `
    <div class="quiz-card" onclick="startQuiz('${qz.id}')">
      <div class="quiz-icon">${qz.icon}</div>
      <div class="quiz-info">
        <h3>${qz.title}</h3>
        <p>${qz.subtitle}</p>
        <div class="quiz-badges">
          <span class="badge">📝 ${qz.questions.length} questions</span>
          <span class="badge">✅ Pass: ${qz.passPct}%</span>
        </div>
      </div>
      <button class="btn-go">Start →</button>
    </div>`).join('');
}

// ════════════════════════════════════════════════
//  START / RETAKE
// ════════════════════════════════════════════════
function startQuiz(id, subsetIndices) {
  const qz = QUIZZES.find(q => q.id === id);
  if (!qz) return;
  S.quizId   = id;
  S.mode     = subsetIndices ? 'retake' : 'full';
  S.qs       = subsetIndices
    ? subsetIndices.map(i => ({ ...qz.questions[i], _orig: i }))
    : qz.questions.map((q, i) => ({ ...q, _orig: i }));
  // Shuffle each question's options (Fisher-Yates), keeping ans in sync
  S.qs = S.qs.map(q => {
    const order = [0, 1, 2, 3];
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    return { ...q, opts: order.map(i => q.opts[i]), ans: order.indexOf(q.ans) };
  });

  S.answers  = new Array(S.qs.length).fill(null);
  S.revealed = new Array(S.qs.length).fill(false);
  S.explOpen = new Array(S.qs.length).fill(false);
  S.idx      = 0;
  S.wrongIdx = [];

  document.getElementById('quizTitleSm').textContent =
    (S.mode === 'retake' ? '⚡ Retake — ' : '') + qz.title;
  showScreen('quizScreen');
  renderQ();
}

function retakeAll()   { startQuiz(S.quizId); }
function retakeWrong() { startQuiz(S.quizId, S.wrongIdx); }

// ════════════════════════════════════════════════
//  QUIZ RENDER
// ════════════════════════════════════════════════
const LABELS = ['A','B','C','D'];

function renderQ() {
  const q      = S.qs[S.idx];
  const total  = S.qs.length;
  const sel    = S.answers[S.idx];
  const rev    = S.revealed[S.idx];
  const isLast = S.idx === total - 1;

  // Progress
  document.getElementById('progFill').style.width = (S.idx / total * 100) + '%';
  document.getElementById('progLabel').textContent = `${S.idx + 1} / ${total}`;

  // Question header
  document.getElementById('qEyebrow').textContent =
    `Question ${S.idx + 1} of ${total}` + (S.mode === 'retake' ? '  ·  Retake' : '');
  document.getElementById('qText').textContent = q.q;
  const qi = document.getElementById('qImg');
  if (q.img) { qi.innerHTML = q.img; qi.style.display = ''; }
  else        { qi.innerHTML = '';    qi.style.display = 'none'; }

  // Options — locked after answering, show correct/wrong colours
  document.getElementById('optContainer').innerHTML = q.opts.map((opt, i) => {
    let cls = 'opt';
    let icon = '';
    if (rev) {
      if (i === q.ans)                   { cls += ' correct'; icon = '<span class="opt-result">✅</span>'; }
      else if (i === sel && i !== q.ans) { cls += ' wrong';   icon = '<span class="opt-result">❌</span>'; }
    } else if (i === sel) {
      cls += ' selected';
    }
    return `<button class="${cls}" onclick="pickOpt(${i})" ${rev ? 'disabled' : ''}>
              <span class="opt-lbl">${LABELS[i]}</span><span style="flex:1">${opt}</span>${icon}
            </button>`;
  }).join('');

  // Explanation toggle button (appears only after answering)
  const toggleRow = document.getElementById('explToggleRow');
  const btnExpl   = document.getElementById('btnExpl');
  const eb        = document.getElementById('explBox');
  if (rev && q.exp) {
    toggleRow.style.display = '';
    const open = S.explOpen[S.idx];
    btnExpl.textContent = open ? '💡 Hide Explanation' : '💡 Show Explanation';
    if (open) {
      eb.innerHTML     = `<b>💡 Explanation:</b> ${q.exp}`;
      eb.style.display = '';
    } else {
      eb.style.display = 'none';
    }
  } else {
    toggleRow.style.display = 'none';
    eb.style.display        = 'none';
  }

  // Prev button
  document.getElementById('btnPrev').disabled = S.idx === 0;

  // Next button — always active, label changes on last question
  const nb = document.getElementById('btnNext');
  nb.disabled    = false;
  nb.className   = 'btn-nav btn-next';
  nb.textContent = isLast ? 'View Results →' : 'Next →';
}

function pickOpt(i) {
  if (S.revealed[S.idx]) return;   // already answered
  S.answers[S.idx]  = i;
  S.revealed[S.idx] = true;        // immediately reveal result
  S.explOpen[S.idx] = false;       // explanation starts closed
  renderQ();
}

function toggleExpl() {
  S.explOpen[S.idx] = !S.explOpen[S.idx];
  renderQ();
}

function nextQ() {
  if (S.idx === S.qs.length - 1) { showResults(); return; }
  S.idx++;
  renderQ();
}

function prevQ() {
  if (S.idx > 0) { S.idx--; renderQ(); }
}

// ════════════════════════════════════════════════
//  RESULTS
// ════════════════════════════════════════════════
function showResults() {
  const qz      = QUIZZES.find(q => q.id === S.quizId);
  const total   = S.qs.length;
  const correct = S.qs.filter((q, i) => S.answers[i] === q.ans).length;
  const wrong   = total - correct;
  const pct     = Math.round(correct / total * 100);
  const passed  = pct >= qz.passPct;

  document.getElementById('scorePct').textContent  = pct + '%';
  document.getElementById('scoreTag').textContent  = passed ? 'PASSED' : 'FAILED';
  document.getElementById('scoreRing').className   = 'score-ring ' + (passed ? 'pass' : 'fail');
  document.getElementById('resultsTitle').textContent =
    qz.title + (S.mode === 'retake' ? ' — Retake' : '');
  document.getElementById('statOk').textContent   = correct;
  document.getElementById('statBad').textContent  = wrong;
  document.getElementById('statTot').textContent  = total;

  // Collect original indices of wrong answers for retake
  S.wrongIdx = S.qs
    .map((q, i) => S.answers[i] !== q.ans ? q._orig : -1)
    .filter(i => i >= 0);
  document.getElementById('btnRetakeWrong').style.display = S.wrongIdx.length ? '' : 'none';

  // Review list
  document.getElementById('reviewList').innerHTML = S.qs.map((q, i) => {
    const ua = S.answers[i];
    const ok = ua === q.ans;
    return `<div class="review-item">
      <div class="rev-icon">${ok ? '✅' : '❌'}</div>
      <div class="rev-body">
        <div class="rev-q">${q.q}</div>
        <div class="rev-ans">${ok
          ? `<span class="ans-ok">✓ ${LABELS[q.ans]}. ${q.opts[q.ans]}</span>`
          : `<span class="ans-bad">${ua !== null ? LABELS[ua] + '. ' + q.opts[ua] : 'Not answered'}</span>
             &nbsp;→&nbsp;<span class="ans-ok">${LABELS[q.ans]}. ${q.opts[q.ans]}</span>`
        }</div>
      </div>
    </div>`;
  }).join('');

  showScreen('resultsScreen');
}

// ════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════
renderHome();
</script>
